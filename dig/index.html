<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game: Gali Pasukan Chi</title>
    <style>
        :root {
            /* Sky & Surface */
            --sky: #70a1ff;
            --grass-top: #7bed9f;
            --grass: #2ed573;
            
            /* Dirt & Underground */
            --dirt-base: #5c3a21; /* Coklat tanah terang/hangat */
            --dirt-dark: #3e2723;
            --tunnel-color: #1a0f0a; /* Warna gelap dalam lubang */
            
            /* UI Elements */
            --chi-color: #4da6ff;
            --warning-color: #ff4757;
            --gold: #f1c40f;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--dirt-base);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ----- SURFACE (Langit & Rumput) ----- */
        .surface {
            height: 120px;
            background: linear-gradient(
                to bottom, 
                var(--sky) 0%, 
                var(--sky) 75%, 
                var(--grass-top) 75%, 
                var(--grass-top) 80%, 
                var(--grass) 80%, 
                var(--grass) 100%
            );
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border-bottom: 4px solid #1e8449; /* Batas rumput ke tanah */
        }

        /* Hiasan Awan Sederhana */
        .surface::before, .surface::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 50px;
        }
        .surface::before {
            width: 80px; height: 30px;
            top: 20px; left: 10%;
            box-shadow: 20px -10px 0 10px rgba(255,255,255,0.8), 50px 0 0 0 rgba(255,255,255,0.8);
        }
        .surface::after {
            width: 60px; height: 20px;
            top: 40px; right: 20%;
            box-shadow: 15px -10px 0 5px rgba(255,255,255,0.8), 35px 0 0 0 rgba(255,255,255,0.8);
        }

        h1 {
            font-size: 1.5rem;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
            z-index: 20;
        }

        .stats-container {
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 2px solid var(--gold);
            color: var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-reset {
            background: var(--warning-color);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 0 #c0392b;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-reset:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #c0392b;
        }

        /* ----- UNDERGROUND (Tanah Coklat) ----- */
        #game-board {
            flex: 1;
            padding: 10px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            /* Tekstur Tanah Khas Game */
            background-color: var(--dirt-base);
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.12'/%3E%3C/svg%3E"),
                radial-gradient(circle at 50% 100%, rgba(0,0,0,0.5) 0%, transparent 100%);
            box-shadow: inset 0 20px 20px -20px rgba(0,0,0,0.8);
        }

        /* Header Kolom Level (Baris paling atas sebelum lajur tanah) */
        .global-level-headers {
            display: flex;
            margin-left: 160px; /* Offset label nama */
            margin-bottom: 5px;
            padding-right: 15px; /* Offset padding kanan */
        }

        .global-header-slot {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            font-weight: bold;
            padding-bottom: 5px;
        }

        .req-text-global {
            font-size: 0.75rem;
            color: #ffb142;
            text-shadow: 1px 1px 2px black;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 2px;
        }

        .lane {
            display: flex;
            align-items: center;
            /* Lajur belum digali = menyatu dengan tanah */
            background: transparent;
            border-radius: 8px;
            height: 7vh;
            min-height: 45px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .lane:active {
            transform: scale(0.99);
        }

        .lane-label {
            position: absolute;
            left: 15px;
            z-index: 5;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 1px 1px 4px black, -1px -1px 4px black;
            pointer-events: none;
            width: 140px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Area batas luar galian di tanah */
        .dirt-block {
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.1); 
            border: 1px dashed rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        /* LUBANG GALIAN (Gelap) yang membentang dari kiri ke kanan */
        .tunnel {
            height: 100%;
            background: var(--tunnel-color);
            width: 0%; /* Diatur via JS */
            transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            border-right: 4px solid #0a0503;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8), inset 0 -5px 10px rgba(0,0,0,0.8);
            border-radius: 8px 0 0 8px;
            z-index: 2;
        }

        /* Grid tempat pacul akan muncul */
        .hoe-container {
            position: absolute;
            top: 0; bottom: 0; left: 160px; right: 0;
            display: flex;
            pointer-events: none;
            z-index: 3;
        }

        .hoe-slot {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s;
            transform: scale(0.5);
        }

        .hoe-slot.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Container untuk Batu (Penghalang) */
        .rock-container {
            position: absolute;
            top: 0; bottom: 0; left: 160px; right: 0;
            display: flex;
            pointer-events: none;
            z-index: 5;
        }

        .rock-slot {
            flex: 1;
            display: flex;
            justify-content: flex-start; /* Berada di sisi kiri kotak (di batas level) */
            align-items: center;
            font-size: 1.2rem;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: scale(0) rotate(0deg);
            margin-left: -12px; /* Geser pas ke garis batas */
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8));
        }

        .rock-slot.show {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .rock-slot.destroyed {
            opacity: 0;
            transform: scale(1.5) translateY(-20px) rotate(45deg);
            filter: grayscale(1) brightness(2);
        }

        .level-markers {
            position: absolute;
            left: 160px; /* Offset menyesuaikan lebar label nama */
            right: 0;
            top: 0;
            bottom: 0;
            display: flex;
            pointer-events: none;
            z-index: 4;
        }

        .marker {
            flex: 1;
            border-left: 2px dashed rgba(255,255,255,0.15);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .marker.easy-state {
            background-color: rgba(46, 213, 115, 0.2);
            box-shadow: inset 0 0 15px rgba(46, 213, 115, 0.4);
            border: 1px solid rgba(46, 213, 115, 0.6);
        }

        .marker.hard-state {
            background-color: rgba(255, 71, 87, 0.2);
            box-shadow: inset 0 0 15px rgba(255, 71, 87, 0.4);
            border: 1px solid rgba(255, 71, 87, 0.6);
        }

        .marker.active-green-state {
            background-color: rgba(46, 213, 115, 0.4);
            box-shadow: inset 0 0 20px rgba(46, 213, 115, 0.8), 0 0 10px rgba(46, 213, 115, 0.5);
            border: 2px solid rgba(46, 213, 115, 1);
            animation: flowPulse 1s infinite alternate;
            z-index: 10;
        }

        @keyframes flowPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .req-text {
            font-size: 0.65rem;
            color: #ffb142;
            text-shadow: 1px 1px 2px black;
            margin-top: 2px;
            position: absolute;
            font-weight: bold;
        }

        .lane-status {
            position: absolute;
            right: 15px;
            z-index: 5;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 1px 1px 3px black;
            pointer-events: none;
        }

        /* Overlay Peringatan Mentok */
        #warning-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(3px);
        }

        #warning-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .warning-box {
            background: #2f3542;
            border: 4px solid var(--warning-color);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
        }

        #warning-overlay.show .warning-box {
            transform: scale(1);
        }

        .warning-box h2 {
            color: var(--warning-color);
            margin-bottom: 15px;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .warning-box p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-close {
            background: var(--warning-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 0 #c0392b;
        }

        .btn-close:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #c0392b;
        }

        .zen-mode {
            animation: zenPulse 2s infinite alternate;
        }

        @keyframes zenPulse {
            0% { box-shadow: inset 0 0 20px var(--gold); }
            100% { box-shadow: inset 0 0 100px var(--chi-color); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 1.2rem; }
            .lane-label { font-size: 0.8rem; width: 100px; }
            .level-markers, .hoe-container, .rock-container, .global-level-headers { left: 100px; margin-left: 100px; }
            .hoe-slot, .rock-slot { font-size: 1rem; }
            .global-header-slot { font-size: 0.7rem; }
            .req-text-global { font-size: 0.6rem; padding: 1px 4px; }
        }
    </style>
</head>
<body>

    <div class="surface">
        <h1>Gali Pasukan Chi</h1>
        <div class="stats-container">
            <div class="stat-box">Total Chi: <span id="total-chi">0</span>/99</div>
            <button class="btn-reset" onclick="resetGame()">↻ Reset</button>
        </div>
    </div>

    <div id="game-board">
        <div class="global-level-headers" id="global-headers">
            <!-- Di-generate via JS -->
        </div>
        <!-- Jalur galian akan di-generate via JS -->
    </div>

    <div id="warning-overlay">
        <div class="warning-box">
            <h2 id="warning-title">⚠️ BENTURAN BATU!</h2>
            <p id="warning-text">Keseimbangan belum tercapai. Anda tidak bisa menggali lebih dalam sebelum titik lain diratakan.</p>
            <p style="font-size: 0.95rem; color: #ced6e0; margin-bottom: 25px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px;">
                Syarat: <span id="req-chi" style="color: var(--gold); font-weight: bold; font-size: 1.1rem;">-</span>
            </p>
            <button class="btn-close" onclick="closeWarning()">Gali Tempat Lain</button>
        </div>
    </div>

    <script>
        const holes = [
            { id: 1, name: "👑 Ubun-ubun", type: "red" },
            { id: 2, name: "👁️ Mata", type: "red" },
            { id: 3, name: "💭 Keinginan", type: "red" }, // Index 2
            { id: 4, name: "🫀 Leher", type: "green" },
            { id: 5, name: "💛 Dada", type: "green" },
            { id: 6, name: "🔥 Ulu Hati", type: "red" },
            { id: 7, name: "🌀 Perut", type: "red" },
            { id: 8, name: "🌱 Cakra Akar", type: "green" },
            { id: 9, name: "💪 Bahu", type: "green" },
            { id: 10, name: "🌊 Rusuk", type: "green" },
            { id: 11, name: "👂 Telinga", type: "green" }
        ];

        const levels = new Array(11).fill(0);
        const MAX_LEVEL = 9;

        const board = document.getElementById('game-board');
        const headersContainer = document.getElementById('global-headers');
        const totalChiEl = document.getElementById('total-chi');
        const warningOverlay = document.getElementById('warning-overlay');
        const reqChiSpan = document.getElementById('req-chi');
        let isZenMode = false;
        let activeGreenPart = -1;

        function rollActiveGreenPart() {
            let eligible = [];
            for(let i=0; i<11; i++) {
                if (i !== 2 && levels[i] >= 5 && levels[i] < 9) {
                    eligible.push(i);
                }
            }
            if (eligible.length > 0) {
                if (eligible.length > 1) {
                    let others = eligible.filter(e => e !== activeGreenPart);
                    activeGreenPart = others[Math.floor(Math.random() * others.length)];
                } else {
                    activeGreenPart = eligible[0];
                }
            } else {
                activeGreenPart = -1;
            }
        }

        function initGame() {
            headersContainer.innerHTML = '';
            for(let i=1; i<=9; i++) {
                const slot = document.createElement('div');
                slot.className = 'global-header-slot';
                slot.innerHTML = `<div>LV${i}</div>`;
                headersContainer.appendChild(slot);
            }

            Array.from(board.children).forEach(child => {
                if(child.id !== 'global-headers') board.removeChild(child);
            });

            holes.forEach((hole, index) => {
                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.onclick = () => dig(index);

                const dirtBlock = document.createElement('div');
                dirtBlock.className = 'dirt-block';
                lane.appendChild(dirtBlock);

                const tunnel = document.createElement('div');
                tunnel.className = 'tunnel';
                tunnel.id = `tunnel-${index}`;
                lane.appendChild(tunnel);

                const hoeContainer = document.createElement('div');
                hoeContainer.className = 'hoe-container';
                for(let i=1; i<=9; i++) {
                    const hoe = document.createElement('div');
                    hoe.className = 'hoe-slot';
                    hoe.id = `hoe-${index}-${i}`;
                    hoe.innerText = '⛏️';
                    hoeContainer.appendChild(hoe);
                }
                lane.appendChild(hoeContainer);

                const rockContainer = document.createElement('div');
                rockContainer.className = 'rock-container';
                for(let i=1; i<=9; i++) {
                    const rock = document.createElement('div');
                    rock.className = 'rock-slot';
                    rock.id = `rock-${index}-${i}`;
                    rockContainer.appendChild(rock);
                }
                lane.appendChild(rockContainer);

                const label = document.createElement('div');
                label.className = 'lane-label';
                label.innerHTML = `<span style="color: var(--gold-dim); font-size: 0.8rem; margin-right: 5px;">${hole.id}</span> ${hole.name}`;
                lane.appendChild(label);

                const markers = document.createElement('div');
                markers.className = 'level-markers';
                for(let i=1; i<=9; i++) {
                    const mark = document.createElement('div');
                    mark.className = 'marker';
                    mark.id = `marker-${index}-${i}`;
                    mark.style.position = 'relative';
                    markers.appendChild(mark);
                }
                lane.appendChild(markers);

                const status = document.createElement('div');
                status.className = 'lane-status';
                status.id = `status-${index}`;
                status.innerText = 'Lv 0';
                lane.appendChild(status);

                board.appendChild(lane);
            });
            updateUI();
        }

        function resetGame() {
            for(let i=0; i<levels.length; i++) {
                levels[i] = 0;
            }
            isZenMode = false;
            activeGreenPart = -1;
            document.body.classList.remove('zen-mode');
            document.querySelector('.stat-box').style.color = 'var(--gold)';
            document.querySelector('.stat-box').style.borderColor = 'var(--gold)';
            updateUI();
        }

        function getTotalChi() {
            return levels.reduce((sum, current) => sum + current, 0);
        }

        function dig(index) {
            if (isZenMode) return;

            const currentLevel = levels[index];
            const targetLevel = currentLevel + 1;
            const hole = holes[index];

            if (targetLevel > MAX_LEVEL) return; 

            // 1. ATURAN AREA MERAH (MATA, UBUN, ULU HATI, PERUT) -> Tertahan ke LV 4
            // (Keinginan dihandle khusus di bawah)
            if (hole.type === 'red' && targetLevel === 4) {
                const greenLv5Count = holes.reduce((count, h, i) => {
                    if (h.type === 'green' && levels[i] >= 5) return count + 1;
                    return count;
                }, 0);

                if (greenLv5Count < 3) {
                    showWarningLockRed(greenLv5Count);
                    shakeLane(index);
                    return;
                }
            }

            // 2. ATURAN KEINGINAN KHUSUS -> Tertahan di LV 4, butuh SEMUA titik lain max
            if (index === 2 && targetLevel >= 5) {
                const allOthersDone = levels.every((lv, i) => i === 2 || lv === 9);
                if (!allOthersDone) {
                    showWarningKeinginan();
                    shakeLane(index);
                    return;
                }
            }

            // 3. ATURAN RANDOM GREEN ZONE -> Dari LV 5 ke atas untuk 10 titik lainnya
            if (index !== 2 && targetLevel >= 6) {
                if (activeGreenPart !== index) {
                    showWarningRandomGreen();
                    shakeLane(index);
                    return;
                }
            }

            // SUKSES MENGGALI
            levels[index] = targetLevel;

            // Reroll Green Zone jika kita berhasil menggali zona tersebut
            // Atau jika ini adalah pertama kalinya sebuah titik mencapai LV 5
            if (index === activeGreenPart || (targetLevel === 5 && activeGreenPart === -1)) {
                rollActiveGreenPart();
            }

            updateUI();
            checkWinCondition();
        }

        function shakeLane(index) {
            const lane = board.children[index + 1]; // +1 karena index 0 adalah global-headers
            if(lane) {
                lane.style.transform = 'translateX(-10px)';
                setTimeout(() => lane.style.transform = 'translateX(10px)', 50);
                setTimeout(() => lane.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => lane.style.transform = 'translateX(0)', 150);
            }
        }

        function updateUI() {
            const total = getTotalChi();
            totalChiEl.innerText = total;

            const offsetMobile = window.innerWidth <= 768 ? 100 : 160;

            const greenLv5Count = holes.reduce((count, h, i) => {
                if (h.type === 'green' && levels[i] >= 5) return count + 1;
                return count;
            }, 0);
            const isRedUnlocked = greenLv5Count >= 3;
            const allOthersDone = levels.every((lv, i) => i === 2 || lv === 9);

            levels.forEach((lv, index) => {
                const tunnel = document.getElementById(`tunnel-${index}`);
                const status = document.getElementById(`status-${index}`);
                const hole = holes[index];
                
                if(lv === 0) {
                    tunnel.style.width = '20px';
                } else {
                    tunnel.style.width = `calc(${offsetMobile}px + ((100% - ${offsetMobile}px) / 9 * ${lv}))`;
                }
                
                if (lv === MAX_LEVEL) {
                    status.innerText = 'ZEN';
                    status.style.color = '#7bed9f';
                } else {
                    status.innerText = `Lv ${lv}`;
                }

                for(let i=1; i<=9; i++) {
                    // Update Pacul
                    const hoe = document.getElementById(`hoe-${index}-${i}`);
                    if (i <= lv) {
                        hoe.classList.add('show');
                    } else {
                        hoe.classList.remove('show');
                    }

                    // Update Marker State & Texts
                    const marker = document.getElementById(`marker-${index}-${i}`);
                    marker.classList.remove('easy-state', 'hard-state', 'active-green-state');
                    marker.innerHTML = ``; // Reset text

                    let showRock = false;

                    // A. Tampilan Bawah (LV 1 - 5)
                    if (i <= 5) {
                        if (hole.type === 'green') {
                            marker.classList.add('easy-state');
                        } else if (hole.type === 'red' && i >= 4) {
                            marker.classList.add('hard-state');
                            // Text untuk area merah selain Keinginan di lv 4
                            if (index !== 2 && i === 4 && !isRedUnlocked && lv < 4) {
                                marker.innerHTML = `<div class="req-text" style="top: 15px;">3x🟩LV5</div>`;
                                showRock = true;
                            }
                            // Text untuk Keinginan di lv 5
                            if (index === 2 && i === 5 && !allOthersDone && lv < 5) {
                                marker.innerHTML = `<div class="req-text" style="top: 15px;">ALL LV9</div>`;
                                showRock = true;
                            }
                        }
                    }

                    // B. Tampilan Atas (LV 6 - 9)
                    if (i >= 6) {
                        if (index === 2) {
                            // Keinginan (semua kotak ke atas hard)
                            marker.classList.add('hard-state');
                            if (i > lv) {
                                if (!allOthersDone) {
                                    showRock = true;
                                    if (i === lv + 1) { // Hanya munculkan teks di kotak selanjutnya
                                        marker.innerHTML = `<div class="req-text" style="top: 15px;">ALL LV9</div>`;
                                    }
                                }
                            }
                        } else {
                            // 10 Titik Lainnya
                            if (activeGreenPart === index && i === lv + 1) {
                                marker.classList.add('active-green-state');
                                marker.innerHTML = `<div class="req-text" style="top: 15px; color: #2ed573;">FLOW⚡</div>`;
                                showRock = false; // Jalur terbuka
                            } else {
                                marker.classList.add('hard-state');
                                if (i > lv) {
                                    showRock = true; // Batu menghalangi
                                }
                            }
                        }
                    }

                    // Update Render Batu
                    const rock = document.getElementById(`rock-${index}-${i}`);
                    if (showRock) {
                        rock.innerText = '🪨';
                        rock.classList.add('show');
                        rock.classList.remove('destroyed');
                    } else {
                        if (rock.classList.contains('show')) {
                            rock.classList.remove('show');
                            rock.classList.add('destroyed');
                        }
                    }
                }
            });
        }

        function showWarningLockRed(currentCount) {
            document.getElementById('warning-title').innerText = "🔴 AREA MERAH (TEGANG)!";
            document.getElementById('warning-text').innerText = "Titik ini sedang sulit dilepaskan dan terhalang batu. Jangan dipaksa! Anda harus menembus area Hijau terlebih dahulu.";
            reqChiSpan.innerHTML = `Butuh minimal 3 area <span style='color:#2ed573'>Hijau</span> mencapai LV 5. (Saat ini: ${currentCount}/3)`;
            warningOverlay.classList.add('show');
        }

        function showWarningKeinginan() {
            document.getElementById('warning-title').innerText = "🔒 KEINGINAN TERKUNCI!";
            document.getElementById('warning-text').innerText = "Keinginan adalah akar yang paling dalam. Anda tidak bisa melepaskannya sekarang.";
            reqChiSpan.innerHTML = `Selesaikan <span style='color:var(--gold)'>10 titik lainnya</span> hingga Titik ZEN (LV 9) terlebih dahulu!`;
            warningOverlay.classList.add('show');
        }

        function showWarningRandomGreen() {
            document.getElementById('warning-title').innerText = "🪨 JALUR BUNTU!";
            document.getElementById('warning-text').innerText = "Fokus Anda terpecah. Ikuti aliran relaksasi tubuh Anda. Cari dan gali titik yang menyala HIJAU!";
            const activeName = activeGreenPart !== -1 ? holes[activeGreenPart].name : "Titik Hijau";
            reqChiSpan.innerHTML = `Aliran relaksasi saat ini ada di: <span style='color:#2ed573; font-size:1.3rem;'>${activeName}</span>`;
            warningOverlay.classList.add('show');
        }

        function closeWarning() {
            warningOverlay.classList.remove('show');
        }

        function checkWinCondition() {
            const isWin = levels.every(lv => lv === MAX_LEVEL);
            if(isWin && !isZenMode) {
                isZenMode = true;
                setTimeout(() => {
                    document.body.classList.add('zen-mode');
                    document.querySelector('.stat-box').style.color = '#7bed9f';
                    document.querySelector('.stat-box').style.borderColor = '#7bed9f';
                    alert("🌟 SELAMAT! Seluruh titik telah mencapai Kedalaman ZEN. Anda telah membuka akses penuh Command Center!");
                }, 800);
            }
        }

        window.addEventListener('resize', updateUI);
        window.onload = initGame;
    </script>
</body>
</html>
